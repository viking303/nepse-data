name: Fix NEPSE Data Date
on:
  workflow_dispatch:
    inputs:
      old_date:
        description: 'Wrong date currently inside the file'
        required: true
        default: '2026-08-02'
      new_date:
        description: 'Correct date to replace it with'
        required: true
        default: '2026-07-31'
      filename:
        description: 'CSV filename in daily_price_data'
        required: true
        default: 'data_2026-07-31_todays_price.csv'

jobs:
  fix-date:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public repo and fix date
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/viking303/nepse-data.git public_repo
          cd public_repo

          OLD="${{ github.event.inputs.old_date }}"
          NEW="${{ github.event.inputs.new_date }}"
          FILE="daily_price_data/${{ github.event.inputs.filename }}"

          if [ ! -f "$FILE" ]; then
            echo "File $FILE not found"; exit 1
          fi

          # Replace the date only in the first (Date) column of each row
          sed -i "s/^${OLD},/${NEW},/" "$FILE"

          git config user.name "viking303"
          git config user.email "prasannaguragain22@gmail.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "fix: correct date ${OLD} -> ${NEW}"
          git push https://x-access-token:${GH_PAT}@github.com/viking303/nepse-data.git main
